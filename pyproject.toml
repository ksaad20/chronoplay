[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "chronoplay"
version = "0.1.0"
description = "Cross-platform, time-synchronized media playout and broadcast scheduling system."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

authors = [
    { name = "Kazi Saad Asif" }
]

keywords = [
    "broadcast",
    "playout",
    "broadcast-automation",
    "media",
    "playlist",
    "scheduler",
    "television",
    "streaming",
    "low-latency",
    "world-clock"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: System :: Distributed Computing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "PyYAML>=6.0",
    "platformdirs>=4.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "bandit>=1.7",
    "build>=1.2",
    "twine>=5.0",
    "pip-audit>=2.7",
]


[project.scripts]
chronoplay = "chronoplay.cli.commands:main"


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]


[tool.coverage.run]
source = ["chronoplay"]
branch = true


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]


[tool.ruff]
line-length = 100
target-version = "py310"

src = ["src", "tests"]

exclude = [
    ".git",
    ".github",
    ".venv",
    "venv",
    "build",
    "dist",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

ignore = [
    "E501",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.10"
mypy_path = ["src"]

warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true


[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
]

[tool.black]
target-version = ["py310", "py311", "py312"]
line-length = 88
