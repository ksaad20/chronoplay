name: Test ChronoPlay

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install test dependencies
        run: |
          python -m pip install pytest pytest-cov

      - name: Install ChronoPlay
        run: |
          python -m pip install -e .

      - name: Verify package import
        run: |
          python -c "import chronoplay; print('ChronoPlay import: OK')"

      - name: Verify CLI
        run: |
          chronoplay --help

      - name: Run test suite
        run: |
          python -m pytest tests/ -v

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=chronoplay \
            --cov-report=term-missing
      - name: Install development dependencies
        run: |
          python -m pip install pytest pytest-cov ruff black bandit

      - name: Check formatting
        run: |
          python -m black --check .

      - name: Run Ruff
        run: |
          python -m ruff check .

      - name: Run Bandit
        run: |
          python -m bandit -r chronoplay -ll
