name: Quality

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install ChronoPlay
        run: |
          python -m pip install -e .

      - name: Install quality tools
        run: |
          python -m pip install ruff black bandit

      - name: Ruff
        run: |
          python -m ruff check .

      - name: Black
        run: |
          python -m black --check .

      - name: Bandit
        run: |
          python -m bandit -r src/chronoplay -ll
