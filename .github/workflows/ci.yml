name: CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================================
  # Code quality
  # ==========================================================

  lint:
    name: Lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

      - name: Install project
        run: |
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          python -m ruff check .

      - name: Check formatting
        run: |
          python -m ruff format --check .

  # ==========================================================
  # Unit and integration tests
  # ==========================================================

  test:
    name: Test / ${{ matrix.os }} / Python ${{ matrix.python-version }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

      - name: Install project
        run: |
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ --verbose --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore

  # ==========================================================
  # Coverage
  # ==========================================================

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

      - name: Install project
        run: |
          python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=chronoplay \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  # ==========================================================
  # Type checking
  # ==========================================================

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

      - name: Install project
        run: |
          python -m pip install -e ".[dev]"

      - name: Run MyPy
        run: |
          python -m mypy src/chronoplay

  # ==========================================================
  # Security checks
  # ==========================================================

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

      - name: Install project
        run: |
          python -m pip install -e ".[dev]"

      - name: Run Bandit
        run: |
          python -m bandit \
            -r src/chronoplay \
            -ll \
            -ii

      - name: Check dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit

  # ==========================================================
  # Package validation
  # ==========================================================

  package:
    name: Package Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel build

      - name: Build package
        run: |
          python -m build

      - name: Validate package
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/

  # ==========================================================
  # CLI smoke test
  # ==========================================================

  smoke-test:
    name: Smoke Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify import
        run: |
          python -c "import chronoplay; print('ChronoPlay import: OK')"

      - name: Verify CLI
        run: |
          python -m chronoplay --help

  # ==========================================================
  # CI gate
  #
  # This job provides one stable status-check name that can be
  # required in GitHub branch protection.
  # ==========================================================

  ci-success:
    name: CI Success
    if: ${{ always() }}

    needs:
      - lint
      - test
      - coverage
      - type-check
      - security
      - package
      - smoke-test

    runs-on: ubuntu-latest

    steps:
      - name: Verify CI results
        run: |
          if [[ \
            "${{ needs.lint.result }}" != "success" || \
            "${{ needs.test.result }}" != "success" || \
            "${{ needs.coverage.result }}" != "success" || \
            "${{ needs.type-check.result }}" != "success" || \
            "${{ needs.security.result }}" != "success" || \
            "${{ needs.package.result }}" != "success" || \
            "${{ needs.smoke-test.result }}" != "success" \
          ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi

          echo "All CI checks passed."
