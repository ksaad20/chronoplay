name: CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================================
  # Code quality
  # ==========================================================

  lint:
    name: Lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

      - name: Install project
        run: |
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          python -m ruff check .

      - name: Check formatting
        run: |
          python -m ruff format --check .

  # ==========================================================
  # Unit and integration tests
  # ==========================================================

  test:
    name: Test / ${{ matrix.os }} / Python ${{ matrix.python-version }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

      - name: Install project
        run: |
          python -m pip install -e ".[dev]"

      - name: Debug pytest discovery
        run: |
         echo "=== Current directory ==="
         pwd

         echo "=== Repository contents ==="
         ls -la

         echo "=== Tests directory ==="
         ls -la tests

         echo "=== All test files ==="
         find tests -type f -print | sort

         echo "=== Tracked test files ==="
         git ls-files | grep '^tests/'

         echo "=== Pytest collection ==="
         python -m pytest --collect-only -vv

      - name: Run test suite
        run: |
          python -m pytest tests/ -v
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore

  # ==========================================================
  # Coverage
  # ==========================================================

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

      - name: Install project
        run: |
          python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --cov=chronoplay \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  # ==========================================================
  # Type checking
  # ==========================================================

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

      - name: Install project
        run: |
          python -m pip install -e ".[dev]"

      - name: Install dependencies
        run: |
         python -m pip install -e ".[dev]"
         python -m pip install "types-PyYAML>=6.0,<7"

      - name: Run mypy
        run: python -m mypy src/chronoplay

  # ==========================================================
  # Security checks
  # ==========================================================

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

      - name: Install project
        run: |
          python -m pip install -e ".[dev]"

      - name: Run Bandit
        run: |
          python -m bandit \
            -r src/chronoplay \
            -ll \
            -ii

      - name: Check dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit

  # ==========================================================
  # Package validation
  # ==========================================================

  package:
    name: Package Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel build

      - name: Build package
        run: |
          python -m build

      - name: Validate package
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  # ==========================================================
  # CLI smoke test
  # ==========================================================

  smoke-test:
    name: Smoke Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify import
        run: |
          python -c "import chronoplay; print('ChronoPlay import: OK')"

      - name: Verify CLI
        run: |
          python -m chronoplay --help

  # ==========================================================
  # CI gate
  #
  # This job provides one stable status-check name that can be
  # required in GitHub branch protection.
  # ==========================================================

  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs:
      - lint
      - test
      - coverage
      - type-check
      - security
      - package
      - smoke-test
    runs-on: ubuntu-latest

    steps:
      - name: Verify CI results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          TYPE_CHECK_RESULT: ${{ needs.type-check.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          SMOKE_TEST_RESULT: ${{ needs.smoke-test.result }}
        shell: bash
        run: |
          if [[ "$LINT_RESULT" != "success" ||
                "$TEST_RESULT" != "success" ||
                "$COVERAGE_RESULT" != "success" ||
                "$TYPE_CHECK_RESULT" != "success" ||
                "$SECURITY_RESULT" != "success" ||
                "$PACKAGE_RESULT" != "success" ||
                "$SMOKE_TEST_RESULT" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi

          echo "All CI checks passed."
